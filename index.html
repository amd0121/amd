<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMD TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0c10;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: #12141c;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #1f222e;
        }
        .menu { color: #ffcc00; font-size: 20px; }
        .brand { color: #ffcc00; font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }

        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .sidebar {
            width: 340px;
            background: #12141c;
            border-right: 1px solid #1f222e;
            overflow-y: auto;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 500;
            color: #b0b3bc;
            cursor: pointer;
            border-bottom: 1px solid #191c27;
        }
        .item:hover { background: #181b26; color: #fff; }
        .item.active { color: #ffcc00; font-weight: bold; background: #1a1d28; }
        .item img { width: 32px; height: 32px; object-fit: contain; border-radius: 4px; }

        .player {
            flex: 1;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            position: relative;
        }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        .status {
            position: absolute;
            color: #ff8080;
            font-size: 14px;
            padding: 10px;
            text-align: center;
        }

        .msg { padding: 20px; color: #777; text-align: center; }
        .error { color: #ff4444; }

        /* Mobil: liste üstte, oynatıcı altta */
        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid #1f222e; }
            .player { height: 60vh; flex: none; }
        }
    </style>
</head>
<body>

    <header>
        <span class="menu">&#9776;</span>
        <span class="brand">AMD TV</span>
    </header>

    <div class="main">
        <div class="sidebar" id="list">
            <p class="msg">Yükleniyor...</p>
        </div>

        <div class="player">
            <video id="video" controls playsinline></video>
            <p class="status" id="status"></p>
        </div>
    </div>

    <script>
        // Kanalları buraya doğrudan yazabilirsin (en kolay yol):
        const CHANNELS = [
            { "n": "BİLARDO TV", "src": "https://test720p.m3u8", "l": "" }
        ];

        // Kanalları uzak bir JSON dosyasından alacaksan adresini yaz. Boş bırakırsan yukarıdaki CHANNELS kullanılır.
        const JSON_URL = '';

        const video = document.getElementById('video');
        const listEl = document.getElementById('list');
        const statusEl = document.getElementById('status');
        let hls = null;

        async function getChannels() {
            if (!JSON_URL) return CHANNELS;

            const res = await fetch(JSON_URL);
            if (!res.ok) throw new Error('Liste alınamadı (HTTP ' + res.status + ')');

            const data = await res.json();
            if (!Array.isArray(data)) throw new Error('Liste bir dizi (array) değil');
            return data;
        }

        function normalize(raw) {
            return raw
                .filter(c => c && c.src)
                .map((c, i) => ({
                    name: c.n || `Kanal ${i + 1}`,
                    url: c.src,
                    logo: c.l || ''
                }));
        }

        function render(channels) {
            listEl.innerHTML = '';

            if (channels.length === 0) {
                listEl.innerHTML = '<p class="msg">Kanal bulunamadı.</p>';
                return;
            }

            channels.forEach((ch, i) => {
                const item = document.createElement('div');
                item.className = 'item';

                if (ch.logo) {
                    const img = document.createElement('img');
                    img.src = ch.logo;
                    img.alt = '';
                    item.appendChild(img);
                }

                const label = document.createElement('span');
                label.textContent = ch.name;
                item.appendChild(label);

                item.addEventListener('click', () => selectChannel(item, ch.url));
                listEl.appendChild(item);

                if (i === 0) selectChannel(item, ch.url);
            });
        }

        function selectChannel(item, url) {
            document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            play(url);
        }

        function play(url) {
            statusEl.textContent = '';

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (window.Hls && Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                hls.on(Hls.Events.ERROR, (_, data) => {
                    if (data.fatal) statusEl.textContent = 'Yayın açılamadı (' + data.type + ')';
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(() => {});
            } else {
                statusEl.textContent = 'Bu tarayıcı HLS yayınlarını desteklemiyor.';
            }
        }

        async function init() {
            try {
                const raw = await getChannels();
                render(normalize(raw));
            } catch (e) {
                console.error(e);
                listEl.innerHTML = '<p class="msg error">Kanallar yüklenemedi!<br><small>' + e.message + '</small></p>';
            }
        }

        init();
    </script>
</body>
</html>
