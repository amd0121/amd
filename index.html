<script>
    // Kanal listesinin JSON adresi (kendi dosyanın linkini yaz)
    const JSON_URL = 'https://gist.githubusercontent.com/zdlone/b083d6b12851d1f6bbe877a743d27db2/raw/spor.json';

    const video = document.getElementById('video');
    const listEl = document.getElementById('list');
    const statusEl = document.getElementById('status');
    let hls = null;

    async function loadChannels() {
        const res = await fetch(JSON_URL);
        if (!res.ok) throw new Error('Liste alınamadı (HTTP ' + res.status + ')');

        const data = await res.json();
        if (!Array.isArray(data)) throw new Error('JSON bir dizi (array) olmalı');

        return data
            .filter(c => c && c.src)
            .map((c, i) => ({
                name: c.n || `Kanal ${i + 1}`,
                url: c.src,
                logo: c.l || ''
            }));
    }

    function render(channels) {
        listEl.innerHTML = '';

        if (channels.length === 0) {
            listEl.innerHTML = '<p class="msg">Kanal bulunamadı.</p>';
            return;
        }

        channels.forEach((ch, i) => {
            const item = document.createElement('div');
            item.className = 'item';

            if (ch.logo) {
                const img = document.createElement('img');
                img.src = ch.logo;
                img.alt = '';
                item.appendChild(img);
            }

            const label = document.createElement('span');
            label.textContent = ch.name;
            item.appendChild(label);

            item.addEventListener('click', () => selectChannel(item, ch.url));
            listEl.appendChild(item);

            if (i === 0) selectChannel(item, ch.url);
        });
    }

    function selectChannel(item, url) {
        document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        play(url);
    }

    function play(url) {
        statusEl.textContent = '';

        if (hls) {
            hls.destroy();
            hls = null;
        }

        if (window.Hls && Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            hls.on(Hls.Events.ERROR, (_, data) => {
                if (data.fatal) statusEl.textContent = 'Yayın açılamadı (' + data.type + ')';
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play().catch(() => {});
        } else {
            statusEl.textContent = 'Bu tarayıcı HLS yayınlarını desteklemiyor.';
        }
    }

    loadChannels()
        .then(render)
        .catch(e => {
            console.error(e);
            listEl.innerHTML = '<p class="msg error">Kanallar yüklenemedi!<br><small>' + e.message + '</small></p>';
        });
</script>
